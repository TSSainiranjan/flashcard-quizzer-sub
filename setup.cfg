[flake8]
max-line-length = 79
exclude = venv,.venv,__pycache__,.git,htmlcov
extend-ignore = E203, W503

[pycodestyle]
max-line-length = 79
exclude = venv,.venv,__pycache__,.git,htmlcov
ignore = E203, W503

[coverage:run]
branch = True
omit =
    venv/*
    .venv/*
    tests/*

[tool:pytest]
addopts = --cov=. --cov-report=term-missing --cov-fail-under=80
testpaths = tests
