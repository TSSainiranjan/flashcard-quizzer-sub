[tool.black]
line-length = 79
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = "venv|.venv"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
